<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mindful Block Redirect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <img id="app-icon" class="cloud-icon" src="data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 60'%3E%3Cpath d='M25 50 A15 15 0 0 1 10 35 A15 15 0 0 1 28 22 A20 20 0 0 1 67 18 A15 15 0 0 1 90 35 A15 15 0 0 1 75 50 Z' fill='none' stroke='%232477b3' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E" alt="Mindful Block" />
        <div>
          <h1>Mindful Block</h1>
          <p>Your calm and fluffy cloud for better browsing.</p>
        </div>
      </header>

      <section class="card">
        <div class="switch-row">
          <div>
            <h2>Calm Guard</h2>
            <p>When you visit a blocked site, we'll redirect you to something more useful.</p>
          </div>
          <label class="md-switch" for="enabledToggle">
            <input id="enabledToggle" type="checkbox" />
            <span class="track"></span>
          </label>
        </div>
        <button id="blockCurrentTab" type="button" class="primary-btn">Block current tab</button>
      </section>

      <details class="card" open>
        <summary>Sites to avoid</summary>
        <form id="domainForm" class="inline-form">
          <input id="domainInput" type="text" placeholder="example.com or https://example.com" />
          <button type="submit" class="tonal-btn">Add</button>
        </form>
        <ul id="domainList" class="list capped-list"></ul>
      </details>

      <details class="card" open>
        <summary>Search engines</summary>
        <ul class="list">
          <li>
            <div class="engine-info">
              <span class="engine-name">Ecosia</span>
              <span class="engine-sub">Plant trees</span>
            </div>
            <label class="md-switch" for="toggle-ecosia">
              <input id="toggle-ecosia" type="checkbox" checked />
              <span class="track"></span>
            </label>
          </li>
          <li>
            <div class="engine-info">
              <span class="engine-name">OceanHero</span>
              <span class="engine-sub">Clean oceans</span>
            </div>
            <label class="md-switch" for="toggle-oceanhero">
              <input id="toggle-oceanhero" type="checkbox" checked />
              <span class="track"></span>
            </label>
          </li>
        </ul>
      </details>

      <details class="card" open>
        <summary>Search ideas</summary>
        <form id="promptForm" class="inline-form">
          <input id="promptInput" type="text" placeholder="What would help you right now?" />
          <button type="submit" class="tonal-btn">Add</button>
        </form>
        <ul id="promptList" class="list capped-list"></ul>
      </details>

      <a class="text-link" href="welcome.html" target="_blank" rel="noreferrer">Open setup &amp; instructions</a>
      <p id="message" role="status" aria-live="polite"></p>
    </main>

    <script src="popup.js" type="module"></script>
  </body>
</html>
