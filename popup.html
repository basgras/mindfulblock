<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mindful Block Redirect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <div class="cloud-icon" aria-hidden="true">☁️</div>
        <div>
          <h1>Mindful Block</h1>
          <p>Gentle focus support</p>
        </div>
      </header>

      <section class="card">
        <div class="switch-row">
          <div>
            <h2>Calm Guard</h2>
            <p>When you visit a blocked site, we'll gently redirect you to something more useful.</p>
          </div>
          <label class="md-switch" for="enabledToggle">
            <input id="enabledToggle" type="checkbox" />
            <span class="track"></span>
          </label>
        </div>
        <button id="blockCurrentTab" type="button" class="primary-btn">Block current tab</button>
      </section>

      <details class="card" open>
        <summary>Sites to avoid</summary>
        <form id="domainForm" class="inline-form">
          <input id="domainInput" type="text" placeholder="example.com or https://example.com" />
          <button type="submit" class="tonal-btn">Add</button>
        </form>
        <ul id="domainList" class="list capped-list"></ul>
      </details>

      <details class="card" open>
        <summary>Mindful prompts</summary>
        <form id="promptForm" class="inline-form">
          <input id="promptInput" type="text" placeholder="What would help you right now?" />
          <button type="submit" class="tonal-btn">Add</button>
        </form>
        <ul id="promptList" class="list capped-list"></ul>
      </details>

      <a class="text-link" href="welcome.html" target="_blank" rel="noreferrer">Open setup & instructions</a>
      <p id="message" role="status" aria-live="polite"></p>
    </main>

    <script src="popup.js" type="module"></script>
  </body>
</html>
